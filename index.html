<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Password Strength Checker</h1>

        <div class="password-box">
            <input type="password" id="password" placeholder="Type a password">
            <button id="togglePassword">Show</button>
        </div>

        <div id="strength">Strength: </div>

        <div class="strength-bar">
            <div id="bar"></div>
        </div>

        <p id="tips">
            Tips: Add uppercase letters, numbers, and symbols to make it stronger!
        </p>

        <!-- THEME SELECTOR -->
        <select id="themeSelector">
            <option value="light">🌞 Light Theme</option>
            <option value="dark">🌚 Dark Theme</option>
            <option value="cyberpunk">💡 Neon Cyberpunk</option>
        </select>
    </div>

    <script src="script.js"></script>
</body>
</html>
